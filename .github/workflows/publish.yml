on:
  workflow_dispatch:
    inputs:
      test:
        type: boolean
        description: Skip publishing step

      fix:
        type: boolean
        description: Skip build step

      no-tag-check:
        type: boolean
        description: Skip tag checking step

  push:
    tags:
      - "*"

name: 🚀 Publish Package

jobs:
  build:
    strategy:
      matrix:
        arch: ["arm64", "amd64"]
        libc: ["glibc", "musl"]

    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🤖 Setup Qemu
        uses: docker/setup-qemu-action@v4
        with:
          platforms: "arm64"

      - name: 🏗️ Build Addon
        if: ${{ github.event.inputs.fix != 'true' }}
        run: |
          docker run -v ${{ github.workspace }}:/work --platform linux/${{ matrix.arch }} ghcr.io/vencord/venmic-builder-${{ matrix.libc }}-${{ matrix.arch }}:latest /build.sh

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: addon-${{ matrix.libc }}-${{ matrix.arch }}
          path: build/Release

  publish:
    needs: [build]

    permissions:
      id-token: write

    runs-on: ubuntu-latest
    container: fedora:44 

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🛑 Check Tag
        if: ${{ github.event.inputs.no-tag-check != 'true' }}
        run: |
          dnf install -y jq
          pkg_version="v$(jq -r .version < package.json)"
          if [[ "${{ github.ref_name }}" != "$pkg_version" ]]; then
              echo "Tag ${{ github.ref_name }} does not match package.json version $pkg_version" >&2
              exit 1
          fi

      - name: 🍃 Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: 🍃 Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: 🏗️ Setup Dependencies
        run: | 
          dnf install -y libatomic
          pnpm install --ignore-scripts

      - name: 📦 Package (amd64/glibc) 
        uses: ./.github/actions/package
        with:
          libc: "glibc"
          arch: "amd64"

      - name: 📦 Package (amd64/musl) 
        uses: ./.github/actions/package
        with:
          libc: "musl"
          arch: "amd64"

      - name: 📦 Package (arm64/glibc) 
        uses: ./.github/actions/package
        with:
          libc: "glibc"
          arch: "arm64"

      - name: 📦 Package (arm64/musl) 
        uses: ./.github/actions/package
        with:
          libc: "musl"
          arch: "arm64"

      - name: 🛒 Publish
        if: ${{ github.event.inputs.test != 'true' }}
        run: npm stage publish
