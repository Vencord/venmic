name: "🎤 Compile Venmic"
description: "Installs Dependencies & Compiles Venmic"

inputs:
  kind:
    default: "addon"
    required: false
    description: Either 'server' or 'addon'

  libc:
    required: true
    description: Either 'glibc' or 'musl'

runs:
  using: "composite"
  steps:
    - name: 📋 Install Base Dependencies
      shell: sh
      run: ./docker/${{ inputs.libc }}/dependencies.sh

    - name: 🔨 Compile (Server)
      if: inputs.kind == 'server'
      shell: bash
      run: |
        cmake -B build
        cmake --build build

    - name: 🔨 Compile (Addon)
      if: inputs.kind == 'addon'
      shell: bash
      run: |
        npm install --global pnpm
        VENMIC_NOT_DOCKER=1 ./docker/build.sh
